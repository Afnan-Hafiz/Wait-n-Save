version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: waitnsave_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waitnsave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waitnsave_secret}
      POSTGRES_DB: ${POSTGRES_DB:-waitnsave}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waitnsave}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
